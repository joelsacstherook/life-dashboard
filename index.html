<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joel's Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function updateClock() {
            const now = new Date('2026-10-05T15:34:13Z');
            const formatter = new Intl.DateTimeFormat('en-US', {
                hour: 'numeric',
                minute: '2-digit',
                second: '2-digit',
                hour12: true,
                timeZone: 'America/New_York'
            });
            document.getElementById('clock').textContent = formatter.format(now);
            setTimeout(updateClock, 1000);
        }
        function formatTime12(isoString) {
            const date = new Date(isoString);
            return date.toLocaleTimeString('en-US', { 
                hour: 'numeric', 
                minute: '2-digit',
                hour12: true,
                timeZone: 'America/New_York'
            });
        }
        window.addEventListener('DOMContentLoaded', updateClock);
    </script>
</head>
