<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joel's Daily Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function updateClock() {
            const now = new Date('2026-10-05T20:31:56');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
        }
        updateClock();
        setInterval(updateClock, 1000);

        function formatTime12H(date) {
            const d = new Date(date);
            const hours = d.getHours() % 12 || 12;
            const minutes = String(d.getMinutes()).padStart(2, '0');
            const ampm = d.getHours() >= 12 ? 'PM' : 'AM';
            return `${hours}:${minutes} ${ampm}`;
        }

        function toggleCheckbox(el) {
            el.classList.toggle('bg-green-100');
            el.classList.toggle('border-green-500');
            const check = el.querySelector('input');
            check.checked = !check.checked;
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900">
    <!-- Header -->
    <div class="bg-white border-b border-slate-200 px-6 py-5 shadow-sm">
        <div class="flex justify-between items-start mb-2">
            <div>
                <h1 class="text-3xl font-bold text-slate-900">Hi Joel</h1>
                <p class="text-sm text-slate-600">Daily dashboard · Google Calendar, Gmail, and Chess snapshot</p>
            </div>
            <div class="text-right">
                <div class="text-lg font-semibold text-slate-900" id="clock">20:31:56</div>
                <div class="text-sm text-slate-600">October 5, 2026</div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="p-6">
        <!-- Top Row: Schedule + Inbox -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
            <!-- Today's Schedule -->
            <div class="lg:col-span-2 bg-white rounded-lg border border-slate-200 p-6 shadow-sm">
                <h2 class="text-lg font-bold text-slate-900 mb-4">Today's Schedule</h2>
                <div class="space-y-3 max-h-96 overflow-y-auto">
                    <!-- JP3 CrossFit -->
                    <div class="flex gap-3 pb-3 border-b border-slate-100">
                        <div class="flex-shrink-0 w-20 text-sm font-semibold text-blue-700 bg-blue-50 rounded px-2 py-1 text-center">
                            2:30 PM
                        </div>
                        <div class="flex-grow">
                            <div class="font-semibold text-slate-900">JP3 CrossFit w mom in garage</div>
                            <div class="text-xs text-slate-600 mt-1">Duration: 1 hour</div>
                            <span class="inline-block mt-2 px-2 py-1 bg-yellow-100 text-yellow-800 text-xs font-semibold rounded">Fitness</span>
                        </div>
