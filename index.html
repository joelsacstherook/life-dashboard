<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life Dashboard</title>
<style>
  :root {
    --bg: #f3f5f9;
    --surface: #ffffff;
    --surface-2: #f7f8fb;
    --text: #1b2130;
    --muted: #5c667a;
    --border: #e2e6ee;
    --accent: #3b5bdb;
    --accent-soft: #e7ecff;
    --green: #2b8a3e;
    --green-soft: #e3f6e8;
    --amber: #b35c00;
    --amber-soft: #fff1dc;
    --red: #c92a2a;
    --red-soft: #fde8e8;
    --purple: #6741d9;
    --purple-soft: #efe9ff;
    --shadow: 0 1px 2px rgba(20,30,60,.06), 0 4px 16px rgba(20,30,60,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1320;
      --surface: #171c2d;
      --surface-2: #1d2338;
      --text: #e8ebf5;
      --muted: #9aa4bd;
      --border: #2a3250;
      --accent: #8ea2ff;
      --accent-soft: #232c55;
      --green: #6fd388;
      --green-soft: #17301f;
      --amber: #ffb35c;
      --amber-soft: #38280f;
      --red: #ff8787;
      --red-soft: #3a1b1b;
      --purple: #b197fc;
      --purple-soft: #2b2250;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  a { color: var(--accent); }
  a:focus-visible, summary:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }
  .skip-link {
    position: absolute; left: -999px; top: 8px;
    background: var(--accent); color: #fff; padding: 8px 14px; border-radius: 8px; z-index: 10;
  }
  .skip-link:focus { left: 8px; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }

  header.page-header {
    display: flex; flex-wrap: wrap; gap: 12px 24px;
    align-items: flex-end; justify-content: space-between;
    padding: 12px 0 22px;
  }
  .page-header h1 { margin: 0; font-size: clamp(1.7rem, 4vw, 2.3rem); letter-spacing: -.02em; line-height: 1.15; }
  .page-header p { margin: 4px 0 0; color: var(--muted); }
  .summary { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .summary li {
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 14px; font-size: .9rem; box-shadow: var(--shadow);
  }
  .summary strong { font-variant-numeric: tabular-nums; }

  .grid {
    display: grid; gap: 20px;
    grid-template-columns: 1fr;
    align-items: start;
  }
  @media (min-width: 900px) {
    .grid { grid-template-columns: 340px 1fr; }
    .col-side { display: grid; gap: 20px; }
  }
  .col-side { display: grid; gap: 20px; }

  section.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 20px;
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 14px;
  }
  .card-head h2 { margin: 0; font-size: 1.15rem; display: flex; align-items: center; gap: 10px; }
  .icon {
    display: inline-grid; place-items: center; width: 34px; height: 34px;
    border-radius: 10px; background: var(--accent-soft); font-size: 1.1rem;
  }
  .badge {
    background: var(--accent-soft); color: var(--accent);
    font-weight: 600; font-size: .8rem; padding: 3px 10px; border-radius: 999px;
    white-space: nowrap;
  }

  /* Chess */
  .stat-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin: 0; }
  .stat {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px;
  }
  .stat dt { color: var(--muted); font-size: .85rem; font-weight: 500; }
  .stat dd { margin: 2px 0 0; font-size: 2.6rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .note { color: var(--muted); font-size: .85rem; margin: 12px 0 0; }

  /* Calendar */
  .events { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .event {
    display: grid; grid-template-columns: auto 1fr; gap: 16px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-left: 5px solid var(--accent);
    border-radius: 12px; padding: 14px 16px;
  }
  .event-time { min-width: 92px; font-variant-numeric: tabular-nums; }
  .event-time .start { font-weight: 700; font-size: 1.1rem; display: block; }
  .event-time .end { color: var(--muted); font-size: .88rem; display: block; }
  .event h3 { margin: 0 0 4px; font-size: 1.05rem; text-transform: none; }
  .event .meta { margin: 0; color: var(--muted); font-size: .92rem; }
  .event .meta + .meta { margin-top: 2px; }
  @media (max-width: 480px) {
    .event { grid-template-columns: 1fr; gap: 6px; }
    .event-time .start, .event-time .end { display: inline; }
    .event-time .end::before { content: " – "; }
  }

  /* Emails */
  .email-group + .email-group { margin-top: 20px; }
  .email-group h3 {
    margin: 0 0 8px; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); display: flex; align-items: center; gap: 8px;
  }
  .email-group h3 .count {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px;
    padding: 0 8px; font-size: .75rem; letter-spacing: 0;
  }
  .emails { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .emails li {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
    padding: 11px 14px; background: var(--surface);
  }
  .emails li + li { border-top: 1px solid var(--border); }
  .emails li::before {
    content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  }
  .emails .subject { flex: 1 1 260px; font-weight: 600; overflow-wrap: anywhere; }
  .tag {
    font-size: .72rem; font-weight: 700; padding: 2px 9px; border-radius: 999px;
    white-space: nowrap; letter-spacing: .02em;
  }
  .tag.event { background: var(--accent-soft); color: var(--accent); border: 0; border-left: 0; display: inline; padding: 2px 9px; }
  .tag.cancel { background: var(--red-soft); color: var(--red); }
  .tag.update { background: var(--amber-soft); color: var(--amber); }
  .tag.money { background: var(--green-soft); color: var(--green); }
  .tag.work { background: var(--purple-soft); color: var(--purple); }
  .tag.security { background: var(--red-soft); color: var(--red); }
  .tag.info { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }

  .empty {
    display: none;
    text-align: center; padding: 28px 16px; color: var(--muted);
    border: 2px dashed var(--border); border-radius: 12px; background: var(--surface-2);
  }
  .empty .emoji { font-size: 1.8rem; display: block; margin-bottom: 4px; }
  .empty strong { color: var(--text); display: block; }
  .is-empty .empty { display: block; }
  .is-empty .has-data { display: none; }

  footer { margin-top: 28px; text-align: center; color: var(--muted); font-size: .85rem; }

  @media print {
    body { background: #fff; }
    section.card { box-shadow: none; break-inside: avoid; }
  }
</style>
</head>
