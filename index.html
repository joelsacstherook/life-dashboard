<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life Dashboard</title>
<style>
  :root {
    --bg: #f3f5f9;
    --surface: #ffffff;
    --surface-alt: #f7f8fc;
    --text: #1c2233;
    --muted: #5b6478;
    --border: #e1e5ee;
    --accent: #3d5afe;
    --accent-soft: #e8ecff;
    --green: #2e7d32;
    --green-soft: #e6f4e7;
    --amber: #a85d00;
    --amber-soft: #fff1dc;
    --red: #b3261e;
    --red-soft: #fde8e6;
    --shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 4px 16px rgba(20, 30, 60, .06);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1320;
      --surface: #181d2e;
      --surface-alt: #1e2438;
      --text: #eceff8;
      --muted: #a2abc2;
      --border: #2b3249;
      --accent: #8c9eff;
      --accent-soft: #232b52;
      --green: #81c784;
      --green-soft: #1b2f1f;
      --amber: #ffb74d;
      --amber-soft: #38290f;
      --red: #ff8a80;
      --red-soft: #3a1b19;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  a { color: var(--accent); }
  a:focus-visible, .skip:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }
  .skip {
    position: absolute; left: 1rem; top: -4rem;
    background: var(--accent); color: #fff;
    padding: .6rem 1rem; border-radius: 8px; z-index: 10;
    text-decoration: none;
  }
  .skip:focus { top: 1rem; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }

  header.top {
    display: flex; flex-wrap: wrap; align-items: flex-end;
    justify-content: space-between; gap: .75rem 1.5rem;
    padding: 1rem 0 1.25rem;
  }
  header.top h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.2rem); letter-spacing: -.02em; line-height: 1.15; }
  header.top p { margin: .25rem 0 0; color: var(--muted); }
  .summary { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0; padding: 0; list-style: none; }
  .summary li {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: .35rem .85rem; font-size: .9rem;
    box-shadow: var(--shadow);
  }
  .summary strong { font-variant-numeric: tabular-nums; }

  .grid {
    display: grid; gap: 1.25rem;
    grid-template-columns: 1fr;
  }
  @media (min-width: 800px) {
    .grid { grid-template-columns: 1fr 2fr; }
    .full { grid-column: 1 / -1; }
  }

  section.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.25rem;
    min-width: 0;
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; margin-bottom: 1rem;
  }
  .card-head h2 { margin: 0; font-size: 1.15rem; display: flex; align-items: center; gap: .5rem; }
  .card-head .icon { font-size: 1.3rem; }
  .badge {
    background: var(--accent-soft); color: var(--accent);
    font-weight: 600; font-size: .8rem;
    padding: .2rem .65rem; border-radius: 999px;
    white-space: nowrap;
  }

  /* Chess */
  .stat {
    background: var(--surface-alt); border: 1px solid var(--border);
    border-radius: 12px; padding: 1.25rem; text-align: center;
  }
  .stat .value { font-size: 3.5rem; font-weight: 800; line-height: 1; letter-spacing: -.03em; color: var(--accent); }
  .stat .label { margin-top: .5rem; color: var(--muted); font-size: .9rem; }
  .note { color: var(--muted); font-size: .85rem; margin: .85rem 0 0; }

  /* Calendar */
  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
  .event {
    display: grid; grid-template-columns: auto 1fr; gap: 1rem;
    background: var(--surface-alt); border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 12px; padding: 1rem;
  }
  .event .when { min-width: 7.5rem; font-variant-numeric: tabular-nums; }
  .event .when .start { font-weight: 700; font-size: 1.1rem; }
  .event .when .end { color: var(--muted); font-size: .9rem; }
  .event h3 { margin: 0 0 .25rem; font-size: 1.05rem; text-transform: capitalize; }
  .event .meta { margin: 0; color: var(--muted); font-size: .92rem; }
  .tag {
    display: inline-block; font-size: .75rem; font-weight: 600;
    padding: .1rem .55rem; border-radius: 999px;
    background: var(--green-soft); color: var(--green);
    margin-top: .5rem;
  }
  @media (max-width: 480px) {
    .event { grid-template-columns: 1fr; gap: .5rem; }
  }

  /* Emails */
  .email-groups { display: grid; gap: 1rem; grid-template-columns: 1fr; }
  @media (min-width: 700px) { .email-groups { grid-template-columns: 1fr 1fr; } }
  .group {
    background: var(--surface-alt); border: 1px solid var(--border);
    border-radius: 12px; padding: 1rem; min-width: 0;
  }
  .group h3 {
    margin: 0 0 .6rem; font-size: .95rem;
    display: flex; justify-content: space-between; align-items: center; gap: .5rem;
  }
  .group h3 .count {
    font-size: .75rem; font-weight: 600; color: var(--muted);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 0 .55rem;
  }
  .group.warn { border-left: 4px solid var(--amber); }
  .group.work { border-left: 4px solid var(--accent); }
  .group.ok { border-left: 4px solid var(--green); }
  .group.plain { border-left: 4px solid var(--border); }
  .emails { list-style: none; margin: 0; padding: 0; }
  .emails li {
    display: flex; gap: .6rem; align-items: flex-start;
    padding: .55rem 0; border-top: 1px solid var(--border);
    overflow-wrap: anywhere;
  }
  .emails li:first-child { border-top: 0; padding-top: 0; }
  .dot {
    flex: none; width: .55rem; height: .55rem; border-radius: 50%;
    background: var(--accent); margin-top: .5rem;
  }
  .emails .subject { font-weight: 500; }
  .chip {
    display: inline-block; font-size: .7rem; font-weight: 700;
    padding: 0 .45rem; border-radius: 6px; margin-right: .35rem;
    vertical-align: middle; text-transform: uppercase; letter-spacing: .03em;
  }
  .chip.cancel { background: var(--red-soft); color: var(--red); }
  .chip.update { background: var(--amber-soft); color: var(--amber); }
  .chip.new { background: var(--green-soft); color: var(--green); }
  .thread-note { font-size: .82rem; color: var(--muted); margin: .6rem 0 0; }

  /* Empty states */
  .empty {
    text-align: center; color: var(--muted);
    border: 1px dashed var(--border); border-radius: 12px;
    padding: 1.5rem 1rem; margin: 0;
  }
  .empty[hidden] { display: none; }
