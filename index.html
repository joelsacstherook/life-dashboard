<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life Dashboard · Hi Joel</title>
<script src="https://cdn.tailwindcss.com"></script>
<style type="text/tailwindcss">
@layer components {
  .card{@apply rounded-2xl border border-slate-800 bg-slate-900/70 p-5 shadow-xl shadow-black/20;}
  .pill{@apply inline-flex items-center rounded-full px-2 py-0.5 text-[11px] font-semibold ring-1;}
  .ph{@apply bg-rose-500/15 text-rose-300 ring-rose-500/40;}
  .pm{@apply bg-amber-500/15 text-amber-300 ring-amber-500/40;}
  .pl{@apply bg-emerald-500/15 text-emerald-300 ring-emerald-500/40;}
  .lb{@apply rounded bg-slate-800 px-1.5 py-0.5 text-[10px] font-medium text-slate-300;}
  .att{@apply bg-sky-500/20 text-sky-300;}
  .it{@apply rounded-xl border border-slate-800 bg-slate-950/50 p-3 transition;}
  .row{@apply flex cursor-pointer gap-3;}
  .cb{@apply mt-1 h-4 w-4 shrink-0 accent-sky-500;}
  .bd{@apply min-w-0 flex-1;}
  .hd{@apply flex flex-wrap items-center gap-2;}
  .sj{@apply text-sm font-semibold text-white;}
  .dt{@apply ml-auto text-[11px] text-slate-400;}
  .fm{@apply mt-0.5 block text-xs text-slate-400;}
  .tx{@apply mt-1 block text-sm leading-snug text-slate-300;}
  .tg{@apply mt-2 flex flex-wrap gap-1.5;}
  .gh{@apply mb-2 mt-4 flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-slate-400;}
  .tile{@apply rounded-xl border border-slate-800 bg-slate-950/50 p-3;}
  .tile dt{@apply text-[11px] font-medium uppercase tracking-wide text-slate-400;}
  .tile dd{@apply mt-1 text-lg font-semibold text-slate-100;}
  .sum{@apply rounded-2xl border border-slate-800 bg-slate-900/80 p-4;}
  .sum h3{@apply text-xs font-semibold uppercase tracking-wide text-slate-400;}
  .sum p.n{@apply mt-2 text-3xl font-extrabold text-white;}
  .sum p.s{@apply mt-1 text-xs text-slate-400;}
  .ev{@apply relative rounded-xl border border-slate-800 border-l-4 bg-slate-950/50 p-4;}
}
</style>
<style>
  .done{opacity:.55}
  .done .sj{text-decoration:line-through}
  :focus-visible{outline:2px solid #38bdf8;outline-offset:2px}
</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-950 to-indigo-950 text-slate-100 antialiased">
<div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">

  <header class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
    <div>
      <h1 class="text-3xl font-extrabold tracking-tight text-white sm:text-4xl">Hi Joel</h1>
      <p class="mt-1 text-sm text-slate-400">Daily dashboard · Google Calendar, Gmail, Chess, and Weather snapshot.</p>
    </div>
    <div class="rounded-xl border border-slate-800 bg-slate-900/70 px-4 py-3 text-left sm:text-right">
      <p class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Current date &amp; time</p>
      <time id="now" class="mt-1 block text-sm font-semibold text-sky-300" datetime="">Loading…</time>
    </div>
  </header>

  <section aria-labelledby="focus-h" class="mt-5 flex flex-col gap-3 rounded-2xl border border-slate-800 bg-slate-900/70 px-5 py-3 sm:flex-row sm:items-center sm:justify-between">
    <div class="flex items-center gap-4">
      <h2 id="focus-h" class="text-sm font-semibold text-slate-200">Focus timer</h2>
      <p id="timer" class="font-mono text-3xl font-bold tabular-nums text-white" role="timer" aria-live="off">25:00</p>
      <span id="tstate" class="text-xs text-slate-400">Ready · 25-minute session</span>
    </div>
    <div class="flex gap-2">
      <button id="tstart" type="button" class="rounded-lg bg-sky-500 px-4 py-1.5 text-sm font-semibold text-slate-950 hover:bg-sky-400">Start</button>
      <button id="treset" type="button" class="rounded-lg border border-slate-700 px-4 py-1.5 text-sm font-semibold text-slate-200 hover:bg-slate-800">Reset</button>
    </div>
  </section>

  <main class="mt-6 space-y-6">

    <!-- TOP ROW -->
    <div class="grid grid-cols-1 gap-6 lg:grid-cols-2 lg:items-start">

      <!-- SCHEDULE -->
      <section class="card" aria-labelledby="sched-h">
        <div class="flex items-center justify-between gap-2">
          <h2 id="sched-h" class="text-lg font-bold text-white">Today's Schedule</h2>
          <span class="text-xs text-slate-400">Sun, Oct 4, 2026 · times in Eastern (EDT)</span>
        </div>

        <div class="mt-3 rounded-xl border border-indigo-500/40 bg-indigo-500/10 p-3 text-sm text-indigo-100" role="note">
          <strong class="font-bold text-indigo-200">Coming up:</strong>
          JP meet w/JP3 Algebra 2 Th
